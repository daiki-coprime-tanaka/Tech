    <body>
        <header>
            <h1>sample answer form</h1>
        </header>
        <main>
            <div class="Form">
                <form id="surveyForm">
                    <label><p>名前</p><input type="text" id="name" required></label>
                    <label><p>ご意見</p>
                    <textarea id="feedback" rows="8" required></textarea></label>
                    <button type="submit">送信</button>
                </form>
                <p id="message"></p>
                <p>ロード: <span id="Load"></span></p>
                <p>送　信: <span id="Send"></span></p>
                <p>所　要: <span id="Take"></span>秒</p>
